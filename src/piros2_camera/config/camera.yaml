# Parameters for the usb_cam node driving the C922.
#
# The node name here must match the launch file's `name=` — ROS parameter
# files are keyed by node name, and a mismatch silently applies nothing.
#
# video_device is NOT set here: it must be resolved from the serial-keyed
# symlink at launch time (usb_cam mangles the symlink itself), which YAML
# cannot do. The launch file owns it — docs/camera.md#running-it.
usb_cam:
  ros__parameters:
    # MJPG off the wire, decoded to RGB on the Pi. The only route to 720p30 —
    # uncompressed YUYV is USB-bandwidth-bound to well below that.
    pixel_format: mjpeg2rgb
    # TF frame stamped into every message header — the OPTICAL frame
    # (z forward, x right, y down), because that is the convention image
    # geometry assumes; camera.launch.py publishes its rotation from
    # camera_link. NOTE: the parameter is frame_id — `camera_frame_id` is
    # the ROS 1 name, and usb_cam silently ignores it.
    frame_id: camera_optical_frame
    camera_name: c922
    # Calibration lands here in milestone 5 (camera.md#calibration); until
    # then usb_cam warns that the file is missing, which is honest.
    camera_info_url: ""
    # usb_cam's own default is 50, well below the camera's native 128 — it
    # force-darkens every launch unless overridden here (found 2026-07-24).
    brightness: 128
    # Quality of the RE-encoded /image_raw/compressed stream (the pipeline is
    # camera JPEG -> RGB -> JPEG again; this second encode is where webcam-app
    # comparisons lose). Default 80 is visibly soft; 90 roughly doubles frame
    # size — if the Wi-Fi viewer starts stuttering, this is the knob to lower
    # (live: ros2 param set /usb_cam .image_raw.compressed.jpeg_quality 80).
    image_raw.compressed.jpeg_quality: 90
