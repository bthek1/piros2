# Parameters for the world_mesh session — piros2_world_mesh's own full
# config, forked from world.yaml (world mesh plan) and free to drift.
# Keyed by node name — a mismatch silently applies nothing (same trap as
# camera.yaml). Values that differ from world.yaml are marked MESH-FIRST.
keypoint_detector:
  ros__parameters:
    # ORB feature cap: bounds per-frame cost. 500 is comfortable at
    # 30 fps on the dev box CPU, and a deeper pool also stabilises
    # matching — rank churn at the cap is the main source of unmatched
    # keypoints.
    max_features: 500
    # JPEG re-encode quality for the annotated stream.
    jpeg_quality: 80
    # Matching: reject matches whose descriptor Hamming distance (out of
    # 256 bits) exceeds this — a lookalike corner, not the same physical
    # point. Lower = stricter, fewer green keypoints.
    match_max_distance: 64
    # Match against the pooled descriptors of this many recent frames.
    # 1 = strict frame-to-frame, which loses ~25% of keypoints to
    # detection flicker at the feature cap; 10 forgives a feature that
    # drops out for a few frames and returns.
    match_window: 10
    # Rotation estimator gates. Fewer strict consecutive-pair matches
    # than this and the frame's rotation is not trusted (estimate
    # returns None, orientation holds).
    min_matched_pairs: 8
    # Mean ray residual (radians) allowed after the reject-worst refits;
    # ~0.03 rad ≈ 1.7° ≈ 27 px at fx≈907. Looser admits bad geometry,
    # tighter starves the estimator in blurry motion.
    max_residual_rad: 0.03
    # Relocalization (relocalization plan): the room memory. Keyframes
    # are stored when the view direction is this far from every stored
    # one — ~18° covers a room in a few dozen keyframes — up to the cap
    # (100 ≈ 1.6 MB of descriptors; at the cap the nearest view is
    # replaced, keeping coverage).
    keyframe_novelty_deg: 18.0
    keyframe_cap: 100
    # Frames without consecutive-pair tracking before recognition takes
    # over, and how often (in frames) a full store query may retry — a
    # query is tens of ms, so it is rate-limited, not per-frame.
    relocalize_after: 10
    relocalize_retry: 5
    # A snap needs this many cross-checked matches against one keyframe
    # AND a winner that beats the runner-up by the margin — a wrong
    # relocalization is worse than none (the two-posters problem).
    relocalize_min_pairs: 12
    relocalize_margin: 1.3
    # rgbd mode: cached /depth older than this (seconds, receipt clock)
    # is not trusted for 3D landmarks, and recovered poses within these
    # bounds of the live odometry trigger no snap — rgbd is fine.
    depth_max_age: 1.0
    min_correction_m: 0.3
    min_correction_deg: 10.0
    # Persistence: ~/save_map (`just map-save`) writes maps/room_<stamp>.npz
    # here (git-ignored); map_path loads one at startup and arms
    # recognition immediately — the first match defines odom relative to
    # the stored room. Empty = start with an empty memory.
    map_dir: maps
    map_path: ''
    # SLAM plan P1 — loop-closure detection while tracking is healthy
    # (rgbd mode). keyframe_novelty_m: a same-heading view is still
    # novel once the camera has moved this far (view direction alone is
    # a compass gate; a walked room needs a distance gate too).
    keyframe_novelty_m: 0.3
    # rgbd geometry runs on exact triples — a frame's ORB output, its
    # own depth and the odometry TF *at its stamp* — so a depth frame
    # waits at least sync_min_delay_s for its TF (rgbd stamps TF at the
    # image stamp, ~0.2 s late) and is dropped after sync_max_delay_s.
    sync_min_delay_s: 0.25
    sync_max_delay_s: 1.5
    # Query the store every N depth-paired frames (~5 Hz in, so 3 ≈
    # 0.6 s; a query is tens of ms), skipping keyframes newer than
    # loop_min_age_s or among
    # the last loop_exclude_recent nodes — matching your own last view
    # is not a revisit. A winner must survive RANSAC PnP with at least
    # loop_min_inliers landmarks within loop_reprojection_px, and
    # the drift it implies must be plausible (beyond loop_max_drift_* it
    # is a lookalike wall, not a loop — the two-posters problem again).
    # loop_cooldown_s spaces closures so a camera at rest doesn't add
    # the same edge every query.
    loop_query_every: 3
    loop_min_age_s: 5.0
    loop_exclude_recent: 2
    loop_min_inliers: 30
    loop_reprojection_px: 6.0
    # PnP (keyframe landmarks vs live pixels) is the loop measurement;
    # the 3D-3D fit against live depth cross-checks it — a disagreement
    # beyond these means one depth lied, and the candidate is refused.
    loop_crosscheck_m: 0.15
    loop_crosscheck_deg: 8.0
    loop_max_drift_m: 1.0
    loop_max_drift_deg: 45.0
    loop_cooldown_s: 3.0
    # SLAM plan P2 — the backend (pose_graph.py). Optimise on every new
    # loop edge; Huber width in chi units so one wrong closure bends the
    # graph rather than folding it; edge sigmas: odometry between two
    # keyframes (locally trusted, drifts globally) and a loop edge (a
    # rigid fit on tens of landmarks — measured a few cm). publish_map_tf
    # is set by the launch (slam:=own); map_frame names the corrected
    # frame per REP-105.
    graph_optimize: true
    graph_huber: 2.0
    graph_odom_sigma_m: 0.02
    graph_odom_sigma_deg: 1.0
    graph_loop_sigma_m: 0.03
    graph_loop_sigma_deg: 2.0
    map_frame: map

tsdf_mesher:
  ros__parameters:
    # MESH-FIRST (world.yaml: 0.02), PROVISIONAL until the live sweep
    # measures the cost: 1.5 cm voxels, finer than the 2 cm mono-noise
    # resolution on the bet that rgbd poses + scale alignment leave
    # structure worth it; if the live mesh just gets noisier, put it
    # back.
    voxel_size: 0.015
    # Depth beyond this (metres) is ignored, same reasoning as the
    # mapper's max_range: far monocular depth is a guess.
    depth_max: 6.0
    # MESH-FIRST (world.yaml: 10.0): meshing costs more at the finer
    # density; re-mesh a little less often.
    refresh_period: 15.0
    # TSDF voxels observed fewer times than this don't mesh.
    weight_threshold: 3.0
    # Mesh completion (mesh-completion plan; replaced fill_hole_radius
    # 2026-08-18). Noise-flake components below this triangle count are
    # pruned — the P0 census found ~370 of them on one static scan,
    # masquerading as holes.
    min_component_triangles: 30
    # Every interior boundary loop is closed with a patch assumed from
    # its ring (colour interpolated; each component's largest loop is
    # its frontier and stays open — unseen space is never invented).
    # Loops wider than this radius (metres) are left open as a guard;
    # P0 measured real interior holes at p50 0.073 m.
    fill_max_hole_radius: 0.25
    # Tint assumed patches magenta to inspect what was invented.
    fill_debug_tint: false
    # ~/save also writes a Poisson-closed live_<stamp>_closed.ply —
    # watertight for downstream tools, frontier included (assumed
    # geometry, blobby by nature). The honest PLY is always written.
    save_watertight: true
    # MESH-FIRST (world.yaml: 60000): the Marker budget, enforced by
    # quadric decimation (never by dropping triangles — the old
    # even-subsampling cap peppered the surface with pinholes). The
    # saved PLY always keeps full detail.
    max_triangles: 120000
    # Per-frame depth scale alignment: each frame is scaled by the
    # median ratio against a TSDF ray-cast from its own pose — the fix
    # for the depth model's measured ±4% wobble. The first frame
    # defines the map's scale.
    align: true
    # Below this valid-overlap fraction a frame integrates unaligned —
    # a mostly-new view has nothing to conform to.
    align_min_overlap: 0.2
    # Correction clamp: a disagreement beyond this is a wrong pose or a
    # depth failure, not a wobble; refuse to fold the map.
    align_max_correction: 0.15
    # SLAM plan P3 — the surface follows the graph. world_frame and
    # rebuild are set by the launch from `slam:=` (map + rebuild under
    # the fork's own backend; map only under rtabmap; odom otherwise).
    # The frame memory: how many integrated frames to keep (thinned
    # evenly when full — 400 at half resolution ≈ 200 MB), the depth
    # downsample they are kept at, how far the optimised trajectory
    # must move a frame before a rebuild is worth its ~10 ms/frame, and
    # the minimum spacing between rebuilds.
    rebuild_keep: 400
    rebuild_downsample: 2
    rebuild_min_shift_m: 0.02
    rebuild_min_shift_deg: 1.0
    rebuild_min_interval_s: 8.0

dashboard:
  ros__parameters:
    # Stats panel size: one cell of the retired 2x2 mosaic, a
    # comfortable RViz side-panel size.
    cell_width: 640
    cell_height: 360
    # Rates average over this many seconds; short = jumpy, long = slow
    # to show a stall.
    rate_window: 5.0
    # A feed whose newest arrival (by receipt time — never header.stamp,
    # the camera's stamps lag ~0.73 s by fault) is older than this gets
    # a STALE line in the stats panel.
    stale_after: 2.0
    # Stats refresh rate: decoupled from every input rate on purpose.
    publish_rate: 10.0
    jpeg_quality: 80
