# Parameters for the perception nodes. Keyed by node name — a mismatch
# silently applies nothing (same trap as camera.yaml).
depth_estimator:
  ros__parameters:
    # model_path defaults inside the node to the package's models/ dir
    # (fetched by `just fetch-model`); set it here only to override.
    #
    # Monocular depth is relative — this scale maps the model's inverse-depth
    # output to metres-ish (z = depth_scale / output). Arbitrary until P2's
    # tape-measure check; tune, don't trust.
    depth_scale: 10.0

cloud_projector:
  ros__parameters:
    # Every Nth pixel in both axes: 4 → ~57k points at 720p, 1/16th the
    # build cost, still dense enough to read a room.
    subsample: 4
    # Depth beyond this is the model saying "background"; the 1/x inversion
    # makes those values explode, so they are cut before projection.
    far_clip: 20.0
