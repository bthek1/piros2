# Parameters for the perception nodes. Keyed by node name — a mismatch
# silently applies nothing (same trap as camera.yaml).
depth_estimator:
  ros__parameters:
    # model_path defaults inside the node to the package's models/ dir
    # (fetched by `just fetch-model`); set it here only to override.
    #
    # Monocular depth is relative — this scale maps the model's inverse-depth
    # output to metres-ish (z = depth_scale / output). Arbitrary until P2's
    # tape-measure check; tune, don't trust.
    depth_scale: 10.0

cloud_projector:
  ros__parameters:
    # Every Nth pixel in both axes: 4 → ~57k points at 720p, 1/16th the
    # build cost, still dense enough to read a room.
    subsample: 4
    # Depth beyond this is the model saying "background"; the 1/x inversion
    # makes those values explode, so they are cut before projection.
    far_clip: 20.0

cloud_fusion:
  ros__parameters:
    # The frame the map lives in: base_link while the camera is static
    # (only static TF needed); odom once keypoint odometry exists (P5).
    map_frame: base_link
    # Grid placement in map_frame metres: min corner + extents. The
    # default seed cube starts at the camera and extends 2 m forward
    # (+x in base_link), centred sideways.
    grid_origin: [0.0, -1.0, -0.5]
    grid_size: [2.0, 2.0, 2.0]
    voxel_size: 0.02
    # Half-width of the fused band around a surface: ~3 voxels. Cells
    # further behind a measured surface were never seen — untouched.
    truncation: 0.06
    # Saturation: a cell stops moving with new frames once it has this
    # many observations (~17 s at the depth node's ~3 fps).
    w_max: 50.0
    # Observations before a cell counts as surface at all.
    w_min: 3.0
    # P2 hysteresis: a saturated cell re-opens only after reopen_frames
    # consecutive disagreements bigger than change_threshold metres.
    change_threshold: 0.15
    reopen_frames: 5
    # Map extraction/publish rate — deliberately slower than fusion.
    publish_rate: 1.0
    # Every Nth unobserved cell per axis shown as the faint seed lattice.
    seed_stride: 5
    far_clip: 20.0
