# Parameters for the world dashboard nodes. Keyed by node name — a mismatch
# silently applies nothing (same trap as camera.yaml).
keypoint_detector:
  ros__parameters:
    # ORB feature cap: bounds per-frame cost. 500 is comfortable at
    # 30 fps on the dev box CPU, and a deeper pool also stabilises
    # matching — rank churn at the cap is the main source of unmatched
    # keypoints. (Briefly 100 on 2026-08-04 for overlay readability,
    # before the green/yellow match colouring made density legible.)
    max_features: 500
    # JPEG re-encode quality for the annotated stream.
    jpeg_quality: 80
    # Matching: reject matches whose descriptor Hamming distance (out of
    # 256 bits) exceeds this — a lookalike corner, not the same physical
    # point. Lower = stricter, fewer green keypoints.
    match_max_distance: 64
    # Match against the pooled descriptors of this many recent frames.
    # 1 = strict frame-to-frame, which loses ~25% of keypoints to
    # detection flicker at the feature cap; 10 forgives a feature that
    # drops out for a few frames and returns.
    match_window: 10
    # Rotation estimator gates (world 3D plan P0). Fewer strict
    # consecutive-pair matches than this and the frame's rotation is
    # not trusted (estimate returns None, orientation holds).
    min_matched_pairs: 8
    # Mean ray residual (radians) allowed after the reject-worst refits;
    # ~0.03 rad ≈ 1.7° ≈ 27 px at fx≈907. Looser admits bad geometry,
    # tighter starves the estimator in blurry motion.
    max_residual_rad: 0.03

cloud_mapper:
  ros__parameters:
    # Voxel edge in metres: 5 cm resolves furniture without ballooning
    # the map dict.
    voxel_size: 0.05
    # The merged map republishes at its own pace, decoupled from the
    # ~15 Hz cloud stream.
    map_publish_rate: 1.0
    # Hard cap on distinct voxels; when hit the map logs once and stops
    # growing (no silent eviction) — ~/clear starts over.
    max_voxels: 200000
    # Points farther than this (metres from the lens) are dropped:
    # monocular depth degrades with distance and would smear the
    # panorama.
    max_range: 6.0
    # Fusion (world fusion plan P2): a voxel joins the published map
    # only once this many clouds have observed it — one look is usually
    # depth noise at a surface edge. Raise for a stiller, sparser map.
    min_weight: 2
    # Cap on a voxel's averaging inertia, in observations: evidence
    # never weighs more than this, so a moved object can displace a
    # long-observed surface instead of arguing with its whole history.
    max_weight: 64

mesh_marker:
  ros__parameters:
    # Empty = show the newest .glb/.ply in meshes/ at startup; set a
    # path to pin one. `ros2 service call /mesh_marker/reload` rescans
    # after a fresh fuse without restarting the session.
    mesh_path: ""
    # Display frame for the overlay. The mesh was fused in its
    # capture's own world frame, which is not this session's odom
    # origin — it renders as a reference nearby, not aligned with the
    # live cloud (aligning needs relocalisation, out of scope).
    frame_id: odom

dashboard:
  ros__parameters:
    # Each mosaic cell: 640x360 keeps the full 2x2 dashboard at 1280x720.
    cell_width: 640
    cell_height: 360
    # Rates average over this many seconds; short = jumpy, long = slow to
    # show a stall.
    rate_window: 5.0
    # A panel whose newest frame (by receipt time — never header.stamp, the
    # camera's stamps lag ~0.73 s by fault) is older than this gets a STALE
    # banner.
    stale_after: 2.0
    # Mosaic refresh rate: decoupled from every input rate on purpose.
    publish_rate: 10.0
    jpeg_quality: 80
