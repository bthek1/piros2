# The world_mesh session's overlay (world mesh plan P2) — applied AFTER
# each node's own config by world.launch.py's extra_params argument, so
# only deviations from world.yaml belong here. Anything not listed keeps
# its world.yaml / perception.yaml value.

tsdf_mesher:
  ros__parameters:
    # PROVISIONAL until P2's live sweep measures the cost — quality over
    # glance, but still bounded by the 6 GB card and rclpy marker build
    # time. world.yaml's glance values: 0.02 / 60000 / 10.0.
    #
    # 1.5 cm voxels: finer than the 2 cm mono-noise resolution on the
    # bet that rgbd poses + scale alignment leave structure worth it;
    # if the live mesh just gets noisier, put it back.
    voxel_size: 0.015
    # More surface allowed before the cap truncates — finer voxels mean
    # more triangles for the same room.
    max_triangles: 120000
    # Meshing costs more at this density; re-mesh a little less often.
    refresh_period: 15.0
