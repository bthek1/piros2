# Workspace-level pytest config, needed for running ALL packages' tests in a
# single pytest process (the VSCode Testing sidebar; colcon runs per-package
# and never needed it).
#
# - importlib mode: the three packages each have test_flake8.py etc.; the
#   default import mode cannot hold two modules named test_flake8 at once.
# - launch_testing disabled: its collection hook imports every test module
#   with the default mode and reintroduces the same collision. Re-enable when
#   actual launch tests exist (and scope them per package).
[pytest]
addopts = --import-mode=importlib -p no:launch_testing -p no:launch_ros
