---
# One playbook, both machines. Roles are appended as they are built — the build
# order and what each step must prove is docs/plans/completed/ansible-plan.md.
#
# Run from this directory on ml5:
#   ansible-playbook site.yml --ask-become-pass   # sudo prompts on ml5
#   ansible-playbook site.yml --limit robot       # Pi only; sudo is passwordless

- name: Provision ROS 2 on both machines
  hosts: all
  roles:
    - ros2_apt
    - ros2_install
    - ros2_env

- name: Sensor-head extras
  hosts: robot
  roles:
    - camera
    - workspace
    - wifi
