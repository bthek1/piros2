---
# Robot-only: the C922 and everything needed to publish it. Three packages do
# distinct jobs — usb_cam is the driver, image-transport-plugins is what makes
# /image_raw/compressed exist at all (raw 720p RGB8 @ 30 fps is ~83 MB/s and
# does not fit over Wi-Fi), camera-info-manager carries calibration later.

- name: Install the camera stack
  become: true
  ansible.builtin.apt:
    name:
      - v4l-utils # Ubuntu Server does not ship it; every v4l2-ctl command in the docs needs it
      - "ros-{{ ros_distro }}-usb-cam"
      - "ros-{{ ros_distro }}-image-transport-plugins"
      - "ros-{{ ros_distro }}-camera-info-manager"
    state: present

# Already true via cloud-init on the current install — kept so the role is
# still correct after a future reflash rather than silently assuming it.
- name: User can read video devices
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: video
    append: true

# A group change does not affect the session that made it; without this the
# device check below would run against the stale pre-change session.
# Unconditional because reset_connection ignores `when:` (ansible-core 2.16) —
# the cost is one extra SSH handshake per run.
- name: Reset the connection so the video group takes effect
  ansible.builtin.meta: reset_connection

- name: Look for the camera at its serial-keyed symlink
  ansible.builtin.stat:
    path: "{{ camera_device }}"
  register: camera_symlink

# Fail here, loudly and with the fix, instead of later and cryptically when a
# usb_cam node logs nothing into an empty topic.
- name: Assert the camera is plugged in
  ansible.builtin.assert:
    that: camera_symlink.stat.exists
    fail_msg: >-
      {{ camera_device }} does not exist — the C922 is unplugged, on a
      different port that renumbered it, or replaced by different hardware.
      Check 'ls /dev/v4l/by-id/' on the Pi and update camera_device in
      group_vars/robot.yml if the serial has changed.
    quiet: true
