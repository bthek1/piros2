---
# The project's actual risk lives here: ROS_DOMAIN_ID, ROS_LOCALHOST_ONLY and
# RMW_IMPLEMENTATION must be byte-identical on both hosts — a mismatch produces
# silence, not an error. They have exactly one definition (group_vars/all.yml)
# and this role is the only thing that writes them onto a machine.

# Ubuntu Server generates only C.UTF-8; every ssh session from ml5 forwards
# LC_ALL=en_US.UTF-8 and warns. Harmless but noisy — fix it at the source.
- name: Generate the en_US.UTF-8 locale
  become: true
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Directory for the per-host Cyclone DDS config
  ansible.builtin.file:
    path: "{{ cyclonedds_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Render cyclonedds.xml pinned to {{ dds_interface }}
  ansible.builtin.template:
    src: cyclonedds.xml.j2
    dest: "{{ cyclonedds_config_path }}"
    mode: "0644"
  notify: Remind about the ROS daemon

# One sourcing snippet, referenced from both dotfiles below, so the underlay +
# overlay pair is defined once. See docs/info/setup.md#on-sourcing-ros for what
# sourcing ROS in every shell costs and how to opt out (ROS_AUTO_SOURCE=0).
- name: Directory for the shell-integration files
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ros2"
    state: directory
    mode: "0755"

# Both shells read a cached copy of what sourcing ROS produces rather than
# paying ~0.4 s of Python per shell; this script is what generates it.
- name: Shell-environment generator
  ansible.builtin.copy:
    src: env-delta
    dest: "{{ ansible_env.HOME }}/.config/ros2/env-delta"
    mode: "0755"

- name: Sourcing snippet for bash
  ansible.builtin.template:
    src: ros2-setup.sh.j2
    dest: "{{ ansible_env.HOME }}/.config/ros2/setup.sh"
    mode: "0644"

# Superseded by env-delta (2026-08-19); it was only ever deployed on ml5.
- name: Remove the old fish-only generator
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ros2/env-to-fish"
    state: absent

# The exports go in .profile, NOT .bashrc: Ubuntu's .bashrc opens with an
# interactivity guard (case $- in ... return), so anything appended to it is
# invisible to every non-interactive shell. .profile is read by all login
# shells, which is why `ssh host "bash -lc 'ros2 topic list'"` — how this
# project verifies over SSH — now finds the ros2 command too, not just the
# four variables.
- name: ROS environment variables in .profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED — ROS 2 {{ ros_distro }} environment"
    block: |
      export ROS_DOMAIN_ID={{ ros_domain_id }}
      export ROS_LOCALHOST_ONLY={{ ros_localhost_only }}
      export RMW_IMPLEMENTATION={{ rmw_implementation }}
      export CYCLONEDDS_URI=file://{{ cyclonedds_config_path }}
      [ -r "$HOME/.config/ros2/setup.sh" ] && . "$HOME/.config/ros2/setup.sh"
  notify: Remind about the ROS daemon

# .bashrc catches the interactive shells .profile misses (a new terminal tab is
# non-login). The alias stays useful for re-sourcing after a colcon build.
- name: ROS sourcing in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — ROS 2 {{ ros_distro }}"
    block: |
      alias ros{{ ros_distro }}='source /opt/ros/{{ ros_distro }}/setup.bash'
      [ -r "$HOME/.config/ros2/setup.sh" ] && . "$HOME/.config/ros2/setup.sh"

# fish, where present (ml5 only — the Pi has bash and no reason for more).
# It reads neither .profile nor a bash setup script, so it gets its own file.
- name: Look for fish
  ansible.builtin.stat:
    path: /usr/bin/fish
  register: fish_shell

- name: Directory for fish's autoloaded config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/fish/conf.d"
    state: directory
    mode: "0755"
  when: fish_shell.stat.exists

- name: ROS environment for fish
  ansible.builtin.template:
    src: ros2.fish.j2
    dest: "{{ ansible_env.HOME }}/.config/fish/conf.d/ros2.fish"
    mode: "0644"
  when: fish_shell.stat.exists
  notify: Remind about the ROS daemon
